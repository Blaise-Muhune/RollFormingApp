<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: Source Sans Pro, sans-serif;
      }
      .hint {
        color: #6b7280;
        font-size: 0.9rem;
        line-height: 1.3;
        padding: 0.1rem 0 0.35rem 0;
      }
    </style>
  </head>
  <body>
    <div class="hint">Or paste a screenshot (Ctrl+V / Cmd+V).</div>
    <script>
      function send(type, extra) {
        window.parent.postMessage(
          Object.assign({ isStreamlitMessage: true, type: type }, extra || {}),
          "*"
        );
      }
      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 32 });

      function handlePaste(event) {
        const cd = event.clipboardData;
        if (!cd) return;
        const items = cd.items || [];
        for (let i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.indexOf("image") === 0) {
            event.preventDefault();
            const file = items[i].getAsFile();
            if (!file) continue;
            const reader = new FileReader();
            reader.onload = function () {
              send("streamlit:setComponentValue", {
                value: { dataUrl: reader.result, ts: Date.now() },
                dataType: "json",
              });
            };
            reader.readAsDataURL(file);
            return;
          }
        }
      }

      const FLAG = "__rollFormingPasteImage";
      try {
        const parentDoc = window.parent.document;
        if (window.parent[FLAG]) {
          parentDoc.removeEventListener("paste", window.parent[FLAG], true);
        }
        window.parent[FLAG] = handlePaste;
        parentDoc.addEventListener("paste", handlePaste, true);
      } catch (err) {
        document.addEventListener("paste", handlePaste, true);
      }
    </script>
  </body>
</html>
